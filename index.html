<!DOCTYPE html>
<html lang="de" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redispatch Dashboard — Cernion a²mdm</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="container">
    <nav>
      <hgroup>
        <h1>🔴 Redispatch Dashboard</h1>
        <p>Einspeisemanagement für Redispatch-Operator — Cernion a²mdm</p>
      </hgroup>
    </nav>
    <nav aria-label="breadcrumb">
      <ul>
        <li><button class="active" data-tab="dashboard">Dashboard</button></li>
        <li><button data-tab="anlagen">Anlagen</button></li>
        <li><button data-tab="einstellungen">Einstellungen</button></li>
      </ul>
    </nav>
  </header>
  <main class="container">
    <div id="loading" class="loading-overlay" style="display:none;"><article aria-busy="true">Lade Redispatch-Daten…</article></div>
    <section id="dashboard" class="tab-panel active">
      <h2>Redispatch-Übersicht</h2>
      <div id="dashboard-cards"></div>
      <div class="chart-card" style="margin-top:1.5rem;"><div style="height:300px;"><canvas id="curtailment-chart"></canvas></div></div>
    </section>
    <section id="anlagen" class="tab-panel">
      <h2>EEG-Anlagen</h2>
      <table id="anlagen-table" role="grid">
        <thead><tr><th>Anlage</th><th>Typ</th><th>Leistung</th><th>Status</th><th>Abruf</th><th>Grund</th><th>Vergütung</th></tr></thead>
        <tbody></tbody>
      </table>
    </section>
    <section id="einstellungen" class="tab-panel">
      <h2>API-Konfiguration</h2>
      <form id="settings-form">
        <label>API-Basis-URL<input type="url" id="cfg-url" value="https://api.cernion.de/" required></label>
        <label>Tenant-ID<input type="text" id="cfg-tenant" value="agentic-hackathon" required></label>
        <label>API-Token<input type="password" id="cfg-token" placeholder="optional"></label>
        <button type="submit">Speichern</button>
      </form>
    </section>
  </main>
  <footer class="container"><hr><p><small>Powered by <a href="https://github.com/energychain/cernion-energy-tools">Cernion a²mdm</a> · Hackathon Lauf #7 · STROMDAO GmbH</small></p></footer>
  <script src="api.js"></script><script src="app.js"></script>
</body>
</html>
